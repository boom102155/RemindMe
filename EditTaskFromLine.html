<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>แก้ไขภารกิจ - Remind Me</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <?!= include('style'); ?>
  <style>
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 100;
    }
    .toast.show { opacity: 1; }
    .loading {
      text-align: center;
      color: var(--text-secondary);
      padding: 40px 0;
    }
    .not-found {
      text-align: center;
      color: var(--danger);
      padding: 40px 0;
    }
  </style>
</head>
<body class="standalone-page">
  <div class="card standalone-card" id="app">
    <div class="loading">กำลังโหลดข้อมูล...</div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    var SERVER_EDIT_TASK_ID = '<?= editTaskId ?>' || '';
  </script>

  <script>
    const taskId = SERVER_EDIT_TASK_ID || null;
    const app = document.getElementById('app');
    const toastEl = document.getElementById('toast');
    let record = null;
    let categories = [];
    let lineGroups = [];

    function showToast(message, type) {
      toastEl.textContent = message;
      toastEl.style.background = type === 'error' ? 'var(--danger)' : 'var(--text)';
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 3000);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    function parseNote(note) {
      const endTimeMatch = String(note || '').match(/เวลาเสร็จ:\s*([\d:.]+)\s*\|\s*(.*)/);
      if (endTimeMatch) {
        return {end_time: endTimeMatch[1], description: endTimeMatch[2]};
      }
      const endOnlyMatch = String(note || '').match(/เวลาเสร็จ:\s*([\d:.]+)\s*$/);
      if (endOnlyMatch) {
        return {end_time: endOnlyMatch[1], description: ''};
      }
      return {end_time: '', description: note || ''};
    }

    function buildNote(endTime, description) {
      const desc = description.trim();
      if (endTime) {
        return 'เวลาเสร็จ: ' + endTime + (desc ? ' | ' + desc : '');
      }
      return desc;
    }

    const ALL_DAY_REMINDER_OPTIONS = [
      { value: 0, label: 'ตรงเวลา (08:00)' },
      { value: 1440, label: 'ก่อนหนึ่งวัน (08:00)' },
      { value: 2880, label: 'ก่อน 2 วัน (08:00)' },
      { value: 10080, label: 'ก่อน 1 สัปดาห์' }
    ];

    const TIMED_REMINDER_OPTIONS = [
      { value: 0, label: 'ตรงเวลา' },
      { value: 5, label: 'ก่อน 5 นาที' },
      { value: 15, label: 'ก่อน 15 นาที' },
      { value: 30, label: 'ก่อน 30 นาที' },
      { value: 60, label: 'ก่อน 1 ชั่วโมง' },
      { value: 120, label: 'ก่อน 2 ชั่วโมง' },
      { value: 1440, label: 'ก่อน 1 วัน' },
      { value: 2880, label: 'ก่อน 2 วัน' },
      { value: 10080, label: 'ก่อน 1 สัปดาห์' }
    ];

    function getAvailableReminderOptions(isAllDay, taskDate, dueTime) {
      const baseOptions = isAllDay ? ALL_DAY_REMINDER_OPTIONS : TIMED_REMINDER_OPTIONS;
      const now = new Date();
      const baseTime = isAllDay ? '08:00' : (dueTime || '08:00');
      const taskDateTime = taskDate ? new Date(taskDate + 'T' + baseTime) : null;
      if (!taskDateTime || isNaN(taskDateTime.getTime())) return baseOptions;
      return baseOptions.filter(opt => {
        const reminderTime = new Date(taskDateTime.getTime() - opt.value * 60000);
        return reminderTime >= now;
      });
    }

    function buildReminderOptionsHtml(isAllDay, taskDate, dueTime, selectedValue) {
      const options = getAvailableReminderOptions(isAllDay, taskDate, dueTime);
      return options.map(opt => {
        const selected = String(opt.value) === String(selectedValue) ? 'selected' : '';
        return `<option value="${opt.value}" ${selected}>${escapeHtml(opt.label)}</option>`;
      }).join('');
    }

    function toggleAllDayEdit() {
      const isAllDay = document.getElementById('is_all_day').checked;
      const dueTime = document.getElementById('due_time');
      const endTime = document.getElementById('end_time');
      dueTime.disabled = isAllDay;
      endTime.disabled = isAllDay;
      if (isAllDay) {
        dueTime.value = '08:00';
        endTime.value = '';
      }
      updateReminderOptionsEdit();
    }

    function updateReminderOptionsEdit() {
      const isAllDay = document.getElementById('is_all_day').checked;
      const taskDate = document.getElementById('task_date').value;
      const dueTime = document.getElementById('due_time').value;
      const select = document.getElementById('remind_before_m');
      const currentValue = select.value;
      select.innerHTML = buildReminderOptionsHtml(isAllDay, taskDate, dueTime, currentValue);
    }

    function renderForm() {
      const parsed = parseNote(record.note);
      app.innerHTML = `
        <div class="standalone-header">
          <h1>แก้ไขภารกิจ</h1>
          
        </div>
        <form id="edit-form" onsubmit="event.preventDefault(); saveTask();">
          <div class="form-group">
            <label>ชื่อภารกิจ</label>
            <input type="text" id="task_name" class="form-control" value="${escapeHtml(record.task_name)}" required>
          </div>

          <div class="form-group">
            <label>หมวดหมู่</label>
            <select id="category" class="form-control"></select>
          </div>

          <div class="form-group">
            <div class="all-day-toggle-row">
              <span class="all-day-label">ทั้งวัน</span>
              <label class="toggle-label">
                <input type="checkbox" id="is_all_day" onchange="toggleAllDayEdit()" ${record.is_all_day ? 'checked' : ''}>
                <span class="toggle-switch"></span>
              </label>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>วันที่</label>
              <input type="date" id="task_date" class="form-control" value="${escapeHtml(record.task_date)}" required onchange="updateReminderOptionsEdit()">
            </div>
            <div class="form-group">
              <label>เวลาเริ่ม</label>
              <input type="time" id="due_time" class="form-control" value="${escapeHtml(record.due_time)}" onchange="updateReminderOptionsEdit()">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>เวลาเสร็จ</label>
              <input type="time" id="end_time" class="form-control" value="${escapeHtml(parsed.end_time.replace('.', ':'))}">
            </div>
            <div class="form-group">
              <label>ระดับความเร่งด่วน</label>
              <select id="priority" class="form-control">
                <option value="Low" ${record.priority === 'Low' ? 'selected' : ''}>ต่ำ</option>
                <option value="Medium" ${record.priority === 'Medium' ? 'selected' : ''}>กลาง</option>
                <option value="High" ${record.priority === 'High' ? 'selected' : ''}>สูง</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>การแจ้งเตือน</label>
            <select id="remind_before_m" class="form-control">
              ${buildReminderOptionsHtml(record.is_all_day, record.task_date, record.due_time, record.remind_before_m)}
            </select>
          </div>

          <div class="form-group">
            <label>เป้าหมายการแจ้งเตือน</label>
            <select id="notify_group" class="form-control">
              <option value="false" ${!record.notify_group ? 'selected' : ''}>เฉพาะฉัน</option>
              <option value="__all__" ${record.notify_group && record.notify_group_ids === '__all__' ? 'selected' : ''}>ฉันและทุกกลุ่ม LINE</option>
              <option value="__select__" ${record.notify_group && record.notify_group_ids && record.notify_group_ids !== '__all__' ? 'selected' : ''}>ฉันและกลุ่มที่เลือก</option>
            </select>
            <div id="notify_groups" class="group-checkboxes" style="display:none;"></div>
          </div>

          <div class="form-group">
            <label>คำอธิบาย</label>
            <textarea id="description" class="form-control">${escapeHtml(parsed.description)}</textarea>
          </div>

          <button type="submit" class="btn btn-primary w-100 mb" id="save-btn">บันทึก</button>
          <button type="button" class="btn btn-delete w-100 mt" onclick="deleteTask()">ลบภารกิจ</button>
        </form>
      `;
      populateCategories();
      document.getElementById('category').value = record.category || '';
      populateNotifyGroups();
      toggleAllDayEdit();
    }

    function populateCategories() {
      const select = document.getElementById('category');
      select.innerHTML = categories
        .map(c => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`)
        .join('');
      if (record.category && categories.some(c => c.name === record.category)) {
        select.value = record.category;
      }
    }

    function populateNotifyGroups() {
      const select = document.getElementById('notify_group');
      const container = document.getElementById('notify_groups');
      if (!select || !container) return;
      container.innerHTML = '';
      lineGroups.forEach(g => {
        const label = document.createElement('label');
        label.className = 'group-checkbox';
        label.innerHTML = '<input type="checkbox" value="' + escapeHtml(g.group_id) + '"> ' + escapeHtml(g.name || 'กลุ่ม LINE');
        container.appendChild(label);
      });
      function onChange() {
        container.style.display = select.value === '__select__' ? 'block' : 'none';
      }
      select.removeEventListener('change', onChange);
      select.addEventListener('change', onChange);
      const ids = String(record.notify_group_ids || '').trim();
      const selectedIds = (record.notify_group && ids && ids !== '__all__') ? ids.split(',').map(s => s.trim()).filter(Boolean) : [];
      container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        cb.checked = selectedIds.indexOf(cb.value) >= 0;
      });
      onChange();
    }

    function getNotifyGroupData() {
      const select = document.getElementById('notify_group');
      const container = document.getElementById('notify_groups');
      const value = select ? select.value : 'false';
      if (value === 'false') return { notify_group: false, notify_group_ids: '' };
      if (value === '__all__') return { notify_group: true, notify_group_ids: '__all__' };
      const checked = container ? Array.from(container.querySelectorAll('input:checked')).map(cb => cb.value) : [];
      if (checked.length === 0) return { notify_group: false, notify_group_ids: '' };
      return { notify_group: true, notify_group_ids: checked.join(',') };
    }

    function saveTask() {
      const btn = document.getElementById('save-btn');
      btn.disabled = true;
      btn.textContent = 'กำลังบันทึก...';

      const endTime = document.getElementById('end_time').value;
      const description = document.getElementById('description').value;

      const isAllDay = document.getElementById('is_all_day').checked;
      const notifyData = getNotifyGroupData();
      const data = {
        task_name: document.getElementById('task_name').value.trim(),
        category: document.getElementById('category').value,
        task_date: document.getElementById('task_date').value,
        due_time: isAllDay ? '08:00' : document.getElementById('due_time').value,
        priority: document.getElementById('priority').value,
        remind_before_m: parseInt(document.getElementById('remind_before_m').value || '0', 10),
        notify_group: notifyData.notify_group,
        notify_group_ids: notifyData.notify_group_ids,
        is_all_day: isAllDay,
        note: buildNote(isAllDay ? '' : endTime, description)
      };

      google.script.run
        .withSuccessHandler(() => {
          showToast('บันทึกภารกิจสำเร็จ', 'success');
          btn.textContent = 'บันทึกแล้ว';
          setTimeout(() => {
            btn.disabled = false;
            btn.textContent = 'บันทึก';
          }, 2000);
        })
        .withFailureHandler(err => {
          showToast('บันทึกไม่สำเร็จ: ' + err.message, 'error');
          btn.disabled = false;
          btn.textContent = 'บันทึก';
        })
        .updateTaskFromLine(taskId, data);
    }

    function deleteTask() {
      if (!confirm('คุณแน่ใจหรือไม่ว่าต้องการลบภารกิจนี้?')) return;
      google.script.run
        .withSuccessHandler(() => {
          showToast('ลบภารกิจสำเร็จ', 'success');
          app.innerHTML = '<div class="loading">ลบภารกิจแล้ว คุณสามารถปิดหน้านี้ได้</div>';
        })
        .withFailureHandler(err => showToast('ลบไม่สำเร็จ: ' + err.message, 'error'))
        .deleteTaskFromLine(taskId);
    }

    function loadData() {
      if (!taskId) {
        app.innerHTML = '<div class="not-found">ไม่พบรหัสภารกิจ<br><small style="color:#6B7280">URL: ' + escapeHtml(window.location.href) + '</small></div>';
        return;
      }
      google.script.run
        .withSuccessHandler(result => {
          categories = result.categories || [];
          lineGroups = result.lineGroups || [];
          record = result.record;
          if (!record) {
            app.innerHTML = '<div class="not-found">ไม่พบภารกิจนี้ในระบบ<br><small style="color:#6B7280">ID: ' + escapeHtml(taskId) + '</small></div>';
            return;
          }
          renderForm();
        })
        .withFailureHandler(err => {
          app.innerHTML = '<div class="not-found">โหลดข้อมูลไม่สำเร็จ: ' + err.message + '<br><small style="color:#6B7280">ID: ' + escapeHtml(taskId) + '</small></div>';
        })
        .getTaskRecordWithCategories(taskId);
    }

    loadData();
  </script>
</body>
</html>
