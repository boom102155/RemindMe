<script>
  /* ================= State ================= */
  const state = {
    currentPage: 'dashboard',
    calendarDate: new Date(),
    selectedDate: null,
    categories: [],
    financeCategories: [],
    lineGroups: [],
    settings: {},
    tasks: [],
    financeRecords: [],
    todayFinanceRecords: [],
    financeSummary: { income: 0, expense: 0, balance: 0 },
    charts: {},
    dataLoaded: false,
    financeLoaded: false
  };

  const STORAGE_KEY = 'smart_calendar_state';

  function loadCachedState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const cached = JSON.parse(raw);
      if (Array.isArray(cached.tasks)) state.tasks = cached.tasks;
      if (Array.isArray(cached.categories)) state.categories = cached.categories;
      if (Array.isArray(cached.financeCategories)) state.financeCategories = cached.financeCategories;
      if (Array.isArray(cached.lineGroups)) state.lineGroups = cached.lineGroups;
      if (cached.settings && typeof cached.settings === 'object') state.settings = cached.settings;
      if (cached.financeSummary && typeof cached.financeSummary === 'object') state.financeSummary = cached.financeSummary;
      if (Array.isArray(cached.todayFinanceRecords)) state.todayFinanceRecords = cached.todayFinanceRecords;
      if (Array.isArray(cached.financeRecords)) state.financeRecords = cached.financeRecords;
      if (cached.financeLoaded) state.financeLoaded = true;
    } catch (e) {
      console.warn('loadCachedState failed:', e);
    }
  }

  function saveStateToCache() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        tasks: state.tasks,
        categories: state.categories,
        financeCategories: state.financeCategories,
        lineGroups: state.lineGroups,
        settings: state.settings,
        financeSummary: state.financeSummary,
        todayFinanceRecords: state.todayFinanceRecords,
        financeRecords: state.financeRecords,
        financeLoaded: state.financeLoaded
      }));
    } catch (e) {
      console.warn('saveStateToCache failed:', e);
    }
  }

  const THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const THAI_DAYS = ['อา','จ','อ','พ','พฤ','ศ','ส'];

  const STATUS_MAP = {
    'Pending': {label: 'รอดำเนินการ', class: 'badge-status-pending'},
    'In Progress': {label: 'กำลังดำเนินการ', class: 'badge-status-progress'},
    'Done': {label: 'เสร็จสิ้น', class: 'badge-status-done'}
  };

  const PRIORITY_MAP = {
    'Low': {label: 'ต่ำ', class: 'badge-low'},
    'Medium': {label: 'กลาง', class: 'badge-medium'},
    'High': {label: 'สูง', class: 'badge-high'}
  };

  /* ================= Utility ================= */
  function pad(n) { return n < 10 ? '0' + n : n; }

  function todayStorage() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }

  function todayInputDate() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }

  function toStorageDate(dateObj) {
    const d = new Date(dateObj);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }

  function parseStorageDate(str) {
    const parts = String(str).split('-');
    if (parts.length !== 3) return null;
    return new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
  }

  function formatBE(storageDate) {
    const p = parseStorageDate(storageDate);
    if (!p) return storageDate;
    return `${p.getDate()} ${THAI_MONTHS[p.getMonth()]} ${p.getFullYear() + 543}`;
  }

  function formatThaiLongDate(dateStr) {
    const d = parseStorageDate(dateStr);
    if (!d) return dateStr;
    const dayOfWeek = THAI_DAYS[d.getDay()];
    const dayNum = d.getDate();
    const monthName = THAI_MONTHS[d.getMonth()];
    const thaiYear = d.getFullYear() + 543;
    return `วัน${dayOfWeek}ที่ ${dayNum} ${monthName} พ.ศ. ${thaiYear}`;
  }

  function formatThaiLongDateBE(dateStr) {
    const d = parseStorageDate(dateStr);
    if (!d) return dateStr;
    const dayOfWeek = THAI_DAYS[d.getDay()];
    const dayNum = d.getDate();
    const monthName = THAI_MONTHS[d.getMonth()];
    const thaiYear = d.getFullYear() + 543;
    return `วัน${dayOfWeek}ที่ ${dayNum} ${monthName} ${thaiYear}`;
  }

  function formatMoney(n) {
    return '฿' + Number(n || 0).toLocaleString('th-TH', {minimumFractionDigits: 0, maximumFractionDigits: 2});
  }

  function statusLabel(s) { return STATUS_MAP[s]?.label || s; }
  function statusClass(s) { return STATUS_MAP[s]?.class || 'badge-status-pending'; }
  function priorityLabel(p) { return PRIORITY_MAP[p]?.label || p; }
  function priorityClass(p) { return PRIORITY_MAP[p]?.class || 'badge-medium'; }
  function priorityColor(p) {
    return { Low: '#10B981', Medium: '#F59E0B', High: '#EF4444' }[p] || '#94A3B8';
  }

  function categoryColor(name) {
    const cat = state.categories.find(c => c.name === name);
    return cat ? cat.color : '#94A3B8';
  }

  function categoryBadgeStyle(name) {
    const color = categoryColor(name);
    return `background:${color}15;color:${color};border-color:${color}33;`;
  }

  function getTasksByDateFromState(date) {
    return state.tasks
      .filter(t => t.task_date === date)
      .sort((a, b) => (a.due_time || '').localeCompare(b.due_time || ''));
  }

  function getFinanceByDateFromState(date) {
    return (state.financeRecords || [])
      .filter(r => r.date === date)
      .sort((a, b) => String(b.created_at || '').localeCompare(a.created_at || ''));
  }

  function getTasksForMonthFromState(year, month) {
    return state.tasks.filter(t => {
      const d = parseStorageDate(t.task_date);
      return d && d.getFullYear() === year && d.getMonth() === month;
    }).sort((a, b) => (a.task_date + (a.due_time || '')).localeCompare(b.task_date + (b.due_time || '')));
  }

  function getTaskStatsFromState(date) {
    const tasks = state.tasks.filter(t => t.task_date === date);
    return {
      total: tasks.length,
      pending: tasks.filter(t => t.status !== 'Done').length,
      done: tasks.filter(t => t.status === 'Done').length,
      urgent: tasks.filter(t => t.priority === 'High').length
    };
  }

  async function refreshTasks() {
    try {
      state.tasks = await gsRun('getAllTasks') || [];
      if (state.currentPage === 'dashboard') renderDashboard();
      if (state.currentPage === 'tasks') loadTasks();
    } catch (e) {
      console.error('refreshTasks:', e);
    }
  }

  function financeCategory(name) {
    return state.financeCategories.find(c => c.name === name) || {icon:'', color:'#94A3B8', type:'รายจ่าย'};
  }

  /* ================= Google Apps Script Runner ================= */
  function gsRun(fn, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        [fn](...args);
    });
  }

  /* ================= Navigation ================= */
  function navigateTo(page, skipLoad) {
    state.currentPage = page;
    document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');
    document.querySelectorAll('.nav-links a').forEach(a => a.classList.toggle('active', a.dataset.page === page));
    if (skipLoad) return;
    if (page === 'dashboard') {
      if (state.dataLoaded) renderDashboard();
      else loadDashboard();
    }
    if (page === 'tasks') {
      if (state.dataLoaded) renderTasksFromState();
      else loadTasks();
    }
    if (page === 'finance') {
      if (state.financeRecords.length) renderFinanceFromState();
      loadFinance();
    }
    if (page === 'settings') loadSettingsPage();
  }

  /* ================= Toast ================= */
  function showToast(message, type) {
    type = type || 'info';
    const container = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = message;
    container.appendChild(el);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translateX(100%)';
      setTimeout(() => el.remove(), 250);
    }, 3500);
  }

  /* ================= Modal ================= */
  function openModal(id) { document.getElementById(id).classList.add('active'); }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) closeModal(overlay.id);
    });
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      const active = document.querySelector('.modal-overlay.active');
      if (active) closeModal(active.id);
    }
  });

  let confirmCallback = null;
  function openConfirmModal(title, message, okText, callback) {
    document.getElementById('confirm-modal-title').textContent = title;
    document.getElementById('confirm-modal-message').textContent = message;
    document.getElementById('confirm-modal-ok').textContent = okText || 'ยืนยัน';
    confirmCallback = callback;
    openModal('confirm-modal');
  }
  document.getElementById('confirm-modal-ok').addEventListener('click', () => {
    closeModal('confirm-modal');
    if (confirmCallback) {
      const cb = confirmCallback;
      confirmCallback = null;
      cb();
    }
  });

  /* ================= Initialization ================= */
  async function init() {
    document.getElementById('current-date-label').textContent = formatBE(todayStorage());
    document.getElementById('finance-filter-date').value = todayInputDate();

    // 1) โหลด cache ก่อน เพื่อแสดงผลทันที (ยังไม่ดึง server)
    loadCachedState();
    populateCategorySelects();
    navigateTo('dashboard', true);
    renderDashboard();

    // 2) ดึงข้อมูลจริงใน background แล้วอัปเดต
    try {
      const initial = await gsRun('getInitialData');
      state.categories = initial.categories || [];
      state.financeCategories = initial.financeCategories || [];
      state.lineGroups = initial.lineGroups || [];
      state.settings = initial.settings || {};
      state.tasks = initial.tasks || [];
      state.financeRecords = initial.financeRecords || state.financeRecords;
      state.financeSummary = initial.financeSummary || state.financeSummary;
      state.todayFinanceRecords = initial.todayFinanceRecords || state.todayFinanceRecords;
      state.dataLoaded = true;
      saveStateToCache();
      populateCategorySelects();
      populateNotifyTargetSelects();
      renderCurrentView();

      const urlParams = new URLSearchParams(window.location.search);
      const editFinanceId = urlParams.get('editFinanceId');
      if (editFinanceId) {
        setTimeout(() => openFinanceModalWithId(editFinanceId), 500);
      }

      const viewParam = SERVER_VIEW || urlParams.get('view');
      if (viewParam && ['dashboard','tasks','finance','settings','calendar'].indexOf(viewParam) >= 0) {
        setTimeout(() => navigateTo(viewParam), 500);
      }
    } catch (e) {
      console.error(e);
      showToast('โหลดข้อมูลเริ่มต้นไม่สำเร็จ: ' + e.message, 'error');
    }
  }

  function renderCurrentView() {
    if (state.currentPage === 'dashboard') renderDashboard();
    if (state.currentPage === 'tasks') renderTasksFromState();
    if (state.currentPage === 'finance') {
      if (state.financeLoaded) renderFinanceFromState();
      else loadFinance();
    }
  }

  // ลบ debug code และแก้ null-return bug
  async function loadCategories() {
    state.categories = await gsRun('getCategories') || [];
    if (state.categories.length === 0) {
      try { await gsRun('addCategory', 'Work', '#006664'); } catch (e) {}
      try { await gsRun('addCategory', 'Personal', '#10B981'); } catch (e) {}
      try { await gsRun('addCategory', 'Urgent', '#DC2626'); } catch (e) {}
      try { await gsRun('addCategory', 'Shopping', '#F59E0B'); } catch (e) {}
      state.categories = await gsRun('getCategories') || [];
    }
  }

  async function loadFinanceCategories() {
    state.financeCategories = await gsRun('getFinanceCategories') || [];
    if (state.financeCategories.length === 0) {
      const defaults = [
        ['ค่าอาหาร','รายจ่าย','','#F59E0B'],
        ['ค่าเดินทาง','รายจ่าย','','#0D9488'],
        ['ค่าไฟฟ้า','รายจ่าย','','#EF4444'],
        ['ช้อปปิ้ง','รายจ่าย','','#8B5CF6'],
        ['เงินเดือน','รายรับ','','#10B981'],
        ['อื่นๆ','รายจ่าย','','#94A3B8']
      ];
      for (const d of defaults) {
        try { await gsRun('addFinanceCategory', d[0], d[1], d[2], d[3]); } catch (e) { /* ignore */ }
      }
      state.financeCategories = await gsRun('getFinanceCategories') || [];
    }
  }

  async function loadSettings(showToastMsg) {
    state.settings = await gsRun('getSettings') || {};
    if (showToastMsg !== false) updateSettingsUI();
  }

  function populateCategorySelects() {
    const selects = ['task-category','task-filter-category','finance-category','finance-filter-category'];
    selects.forEach(id => {
      const sel = document.getElementById(id);
      if (!sel) return;
      const isTask = id.startsWith('task');
      const list = isTask ? state.categories : state.financeCategories;
      const old = sel.value;
      sel.innerHTML = '';
      if (id === 'task-filter-category' || id === 'finance-filter-category') {
        const opt = document.createElement('option');
        opt.value = ''; opt.textContent = 'ทุกหมวดหมู่';
        sel.appendChild(opt);
      }
      list.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.name;
        opt.textContent = (isTask ? '' : (c.icon ? c.icon + ' ' : '')) + c.name;
        sel.appendChild(opt);
      });
      const valid = Array.from(sel.options).some(o => o.value === old);
      sel.value = valid ? old : (list[0]?.name || '');
    });
  }

  function populateNotifyTargetSelects() {
    const container = document.getElementById('task-notify-groups');
    const select = document.getElementById('task-notify-target');
    if (!container || !select) return;
    container.innerHTML = '';
    if (state.lineGroups && state.lineGroups.length > 0) {
      state.lineGroups.forEach(g => {
        const label = document.createElement('label');
        label.className = 'group-checkbox';
        label.innerHTML = '<input type="checkbox" value="' + escapeHtml(g.group_id) + '"> ' + escapeHtml(g.name || 'กลุ่ม LINE');
        container.appendChild(label);
      });
    }
    function onChange() {
      container.style.display = select.value === '__select__' ? 'block' : 'none';
    }
    select.removeEventListener('change', onChange);
    select.addEventListener('change', onChange);
    onChange();
  }

  function getSelectedNotifyGroupIds() {
    const select = document.getElementById('task-notify-target');
    if (!select) return { notify_group: false, notify_group_ids: '' };
    const value = select.value;
    if (value === 'false') return { notify_group: false, notify_group_ids: '' };
    if (value === '__all__') return { notify_group: true, notify_group_ids: '__all__' };
    const container = document.getElementById('task-notify-groups');
    const checked = container ? Array.from(container.querySelectorAll('input:checked')).map(cb => cb.value) : [];
    if (checked.length === 0) return { notify_group: false, notify_group_ids: '' };
    return { notify_group: true, notify_group_ids: checked.join(',') };
  }

  function setNotifyTargetFromTask(task) {
    const select = document.getElementById('task-notify-target');
    const container = document.getElementById('task-notify-groups');
    if (!select || !container) return;
    if (!task || !task.notify_group) {
      select.value = 'false';
    } else {
      const ids = String(task.notify_group_ids || '').trim();
      if (ids === '__all__' || !ids) {
        select.value = '__all__';
      } else {
        select.value = '__select__';
        const selectedIds = ids.split(',').map(s => s.trim()).filter(Boolean);
        container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
          cb.checked = selectedIds.indexOf(cb.value) >= 0;
        });
      }
    }
    container.style.display = select.value === '__select__' ? 'block' : 'none';
  }

  function updateSettingsUI() {
    document.getElementById('line-token').value = state.settings.LINE_CHANNEL_ACCESS_TOKEN || '';
    document.getElementById('line-user-id').value = state.settings.LINE_DEFAULT_USER_ID || '';
    document.getElementById('web-app-url').value = state.settings.WEB_APP_URL || '';
    document.getElementById('default-reminder').value = state.settings.DEFAULT_REMIND_MINUTES || '15';
    document.getElementById('timezone-display').value = state.settings.TIMEZONE || 'Asia/Bangkok';
    const richMenuDisplay = document.getElementById('rich-menu-id-display');
    if (richMenuDisplay) richMenuDisplay.value = state.settings.RICH_MENU_ID || '';
    renderLineGroupList();
    updateTriggerStatusUI();
    updateTyphoonOcrStatusUI();
    updateGroqAsrStatusUI();
  }

  async function updateTriggerStatusUI() {
    try {
      const status = await gsRun('getTriggerStatus');
      const pill = document.getElementById('trigger-status');
      if (status.active) {
        pill.className = 'status-pill active';
        pill.textContent = 'กำลังทำงาน';
      } else {
        pill.className = 'status-pill inactive';
        pill.textContent = 'ปิดอยู่';
      }
    } catch (e) { /* ignore */ }
  }

  async function updateTyphoonOcrStatusUI() {
    const status = document.getElementById('typhoon-ocr-api-key-status');
    if (!status) return;
    try {
      const result = await gsRun('getTyphoonOcrStatus');
      status.textContent = result && result.configured
        ? 'ตั้งค่า Typhoon OCR แล้ว — ส่งรูปสลิปในแชตส่วนตัวเพื่อเริ่มจดรายการ'
        : 'ยังไม่ได้ตั้งค่า — ระบบจะยังอ่านรูปสลิปไม่ได้';
    } catch (e) {
      status.textContent = 'ตรวจสอบสถานะ Typhoon OCR ไม่สำเร็จ';
    }
  }

  async function updateGroqAsrStatusUI() {
    const status = document.getElementById('groq-asr-api-key-status');
    if (!status) return;
    try {
      const result = await gsRun('getGroqAsrStatus');
      status.textContent = result && result.configured
        ? 'ตั้งค่า Groq Whisper แล้ว — ส่ง Voice Message ในแชตส่วนตัวเพื่อเริ่มจดรายการ'
        : 'ยังไม่ได้ตั้งค่า — ระบบจะยังจดรายการด้วยเสียงไม่ได้';
    } catch (e) {
      status.textContent = 'ตรวจสอบสถานะ Groq ไม่สำเร็จ';
    }
  }

  /* ================= Dashboard ================= */
  // โหลด parallel แทน serial — เร็วขึ้น ~3x
async function loadDashboard() {
  try {
    const today = todayStorage();
    const [summary, records] = await Promise.all([
      gsRun('getFinanceSummary', 'daily', today),
      gsRun('getFinanceRecords', { date: today })
    ]);
    state.financeSummary = summary;
    state.todayFinanceRecords = records || [];
    renderDashboard();
  } catch (e) {
    showToast('โหลดแดชบอร์ดไม่สำเร็จ: ' + e.message, 'error');
  }
}

function renderDashboard() {
  const today = todayStorage();
  const selectedDate = state.selectedDate || today;
  const year = state.calendarDate.getFullYear();
  const month = state.calendarDate.getMonth();
  const stats = getTaskStatsFromState(selectedDate);
  const dayFinance = computeFinanceSummary(getFinanceByDateFromState(selectedDate));
  document.getElementById('dash-total-today').textContent = stats.total;
  document.getElementById('dash-pending').textContent = stats.pending;
  document.getElementById('dash-completed').textContent = stats.done;
  document.getElementById('dash-balance').textContent = formatMoney(dayFinance.balance || 0);
  document.getElementById('dash-selected-date').textContent = formatThaiLongDateBE(selectedDate);
  document.getElementById('dash-top-pending').textContent = stats.pending;
  document.getElementById('dash-top-done').textContent = stats.done;
  document.getElementById('today-card-date').textContent = formatBE(selectedDate);
  renderTodayTasks(getTasksByDateFromState(selectedDate));
  renderTodayFinance(getFinanceByDateFromState(selectedDate));
  renderCalendar(getTasksForMonthFromState(year, month));
}

  function renderTodayTasks(tasks) {
    const ul = document.getElementById('today-task-list');
    ul.innerHTML = '';
    if (!tasks.length) {
      ul.innerHTML = `
        <li class="empty-state-card">
          <div class="empty-state-icon">◇</div>
          <div class="empty-state-title">ไม่มีงานที่บันทึกไว้</div>
          <div class="empty-state-sub">วันที่เลือกนี้ว่างอยู่ คุณสามารถเพลิดเพลินกับวันหยุดหรือเพิ่มภารกิจใหม่ได้ทันที</div>
        </li>`;
      return;
    }
    tasks.forEach(t => {
      const done = t.status === 'Done';
      const borderColor = priorityColor(t.priority);
      const li = document.createElement('li');
      li.style.borderLeft = `4px solid ${borderColor}`;
      li.innerHTML = `
        <div class="task-row" tabindex="0" role="button" aria-label="แก้ไข ${escapeHtml(t.task_name)}" onclick="openTaskModalWithTaskById('${t.task_id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openTaskModalWithTaskById('${t.task_id}');}">
          <input type="checkbox" ${done ? 'checked' : ''}
            onclick="event.stopPropagation(); toggleTodayTaskStatus('${t.task_id}', this.checked)">
          <div class="task-content">
            <div class="task-title ${done ? 'done' : ''}">${escapeHtml(t.task_name)}</div>
            <div class="task-meta">
              <span>เวลา ${t.due_time || '-'}</span>
              <span class="category-badge" style="${categoryBadgeStyle(t.category)}">${escapeHtml(t.category || 'ทั่วไป')}</span>
            </div>
          </div>
        </div>`;
      ul.appendChild(li);
    });
  }

  function renderTodayFinance(records) {
    const ul = document.getElementById('today-finance-list');
    ul.innerHTML = '';
    records = [...records].sort((a, b) => String(b.created_at || '').localeCompare(a.created_at || ''));
    if (!records.length) {
      ul.innerHTML = `
        <li class="empty-state-card">
          <div class="empty-state-icon">◇</div>
          <div class="empty-state-title">ไม่มีรายการ</div>
          <div class="empty-state-sub">บันทึกรายรับ-รายจ่ายของวันนี้</div>
        </li>`;
      return;
    }
    records.forEach(r => {
      const isIncome = r.type === 'รายรับ';
      const borderColor = isIncome ? '#10B981' : '#EF4444';
      const amountColor = isIncome ? '#10B981' : '#EF4444';
      const cat = financeCategory(r.category);
      const li = document.createElement('li');
      li.style.borderLeft = `4px solid ${borderColor}`;
      li.setAttribute('onclick', `openTodayFinanceById('${r.transaction_id}')`);
      li.innerHTML = `

  async function renderCalendar(tasks) {
    const year = state.calendarDate.getFullYear();
    const month = state.calendarDate.getMonth();
    populateCalendarHeader();

    const grid = document.getElementById('calendar-grid');
    grid.innerHTML = '';

    THAI_DAYS.forEach((d, i) => {
      const h = document.createElement('div');
      h.className = 'calendar-day-header';
      if (i === 0) h.classList.add('sunday');
      if (i === 6) h.classList.add('saturday');
      h.textContent = d;
      grid.appendChild(h);
    });

    const todayStr = todayStorage();
    const selectedDate = state.selectedDate || todayStr;
    const taskMap = {};
    (tasks || []).forEach(t => {
      if (!t.task_date) return;
      if (!taskMap[t.task_date]) taskMap[t.task_date] = [];
      taskMap[t.task_date].push(t);
    });

    const financeMap = {};
    (state.financeRecords || []).forEach(r => {
      if (!r.date || r.type !== 'รายจ่าย') return;
      if (!financeMap[r.date]) financeMap[r.date] = [];
      financeMap[r.date].push(r);
    });

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const prevMonthDays = new Date(year, month, 0).getDate();
    const totalCells = 42;

    for (let i = firstDay - 1; i >= 0; i--) {
      const dayNum = prevMonthDays - i;
      const dateStr = toStorageDate(new Date(year, month - 1, dayNum));
      grid.appendChild(createDayCell(dayNum, dateStr, false));
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${pad(month + 1)}-${pad(d)}`;
      const cell = createDayCell(d, dateStr, true);
      if (dateStr === todayStr) cell.classList.add('today');
      if (dateStr === selectedDate) cell.classList.add('selected');
      grid.appendChild(cell);
    }

    const filled = firstDay + daysInMonth;
    const remaining = totalCells - filled;
    for (let i = 1; i <= remaining; i++) {
      const dateStr = toStorageDate(new Date(year, month + 1, i));
      grid.appendChild(createDayCell(i, dateStr, false));
    }

    function createDayCell(dayNum, dateStr, isCurrentMonth) {
      const cell = document.createElement('div');
      cell.className = 'calendar-day' + (isCurrentMonth ? '' : ' other-month');
      cell.setAttribute('tabindex', '0');
      cell.setAttribute('role', 'button');
      cell.setAttribute('aria-label', `วันที่ ${dayNum} ${formatThaiLongDate(dateStr)}`);
      cell.innerHTML = `<div class="calendar-day-number">${dayNum}</div>`;

      const dayTasks = taskMap[dateStr] || [];
      const taskContainer = document.createElement('div');
      taskContainer.className = 'calendar-day-tasks';

      const maxBadges = window.innerWidth < 640 ? 1 : 2;
      dayTasks.slice(0, maxBadges).forEach(t => {
        const badge = document.createElement('div');
        badge.className = 'calendar-task-badge';
        badge.style.cssText = categoryBadgeStyle(t.category);
        badge.textContent = t.task_name || 'งาน';
        if (t.status === 'Done') {
          badge.style.textDecoration = 'line-through';
          badge.style.opacity = '0.5';
        }
        taskContainer.appendChild(badge);
      });

      if (dayTasks.length > maxBadges) {
        const more = document.createElement('div');
        more.className = 'calendar-more';
        more.textContent = `+ อีก ${dayTasks.length - maxBadges} งาน`;
        taskContainer.appendChild(more);
      }

      cell.appendChild(taskContainer);

      const dayFinances = financeMap[dateStr] || [];
      if (dayFinances.length > 0) {
        const indicator = document.createElement('div');
        indicator.className = 'finance-indicator';
        indicator.innerHTML = `฿ ${dayFinances.length}`;
        cell.appendChild(indicator);
      }

      function activate() {
        state.selectedDate = dateStr;
        renderDashboard();
        openDayModal(dateStr);
      }
      cell.addEventListener('click', activate);
      cell.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          activate();
        }
      });

      return cell;
    }
  }

  function updateReminderOptions() {
    const isAllDay = document.getElementById('task-all-day').checked;
    const dateInput = document.getElementById('task-date').value;
    const timeInput = document.getElementById('task-start-time').value;
    const select = document.getElementById('task-reminder');
    const lineEnabled = document.getElementById('task-line-reminder').checked;
    const currentValue = select.value;

    const options = isAllDay ? ALL_DAY_REMINDER_OPTIONS : TIMED_REMINDER_OPTIONS;
    let taskDateTime = null;
    if (dateInput) {
      const baseTime = isAllDay ? '08:00' : (timeInput || '08:00');
      taskDateTime = new Date(dateInput + 'T' + baseTime);
    }
    const now = new Date();

    select.innerHTML = '';
    options.forEach(opt => {
      let enabled = true;
      if (taskDateTime && !isNaN(taskDateTime.getTime())) {
        const reminderTime = new Date(taskDateTime.getTime() - opt.value * 60000);
        if (reminderTime < now) enabled = false;
      }
      const option = document.createElement('option');
      option.value = String(opt.value);
      option.textContent = opt.label;
      option.disabled = !enabled;
      select.appendChild(option);
    });

    if (currentValue) {
      const match = Array.from(select.options).find(o => o.value === currentValue && !o.disabled);
      if (match) select.value = currentValue;
    }
    select.disabled = !lineEnabled;
  }

  function parseClientDate(str) {
    const parts = String(str).split('-');
    if (parts.length !== 3) return null;
    return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
  }

  function inPeriod(recordDate, period, periodDateStr) {
    const rp = parseClientDate(recordDate);
    if (!rp) return false;
    const dp = parseClientDate(periodDateStr);
    if (!dp) return false;
    if (period === 'daily') {
      return rp.getFullYear() === dp.getFullYear() && rp.getMonth() === dp.getMonth() && rp.getDate() === dp.getDate();
    }
    if (period === 'monthly') {
      return rp.getFullYear() === dp.getFullYear() && rp.getMonth() === dp.getMonth();
    }
    if (period === 'yearly') {
      return rp.getFullYear() === dp.getFullYear();
    }
    return true;
  }

  function computeFinanceSummary(records) {
    let income = 0, expense = 0;
    (records || []).forEach(r => {
      if (r.type === 'รายรับ') income += r.amount || 0;
      else expense += r.amount || 0;
    });
    return { income, expense, balance: income - expense };
  }

  function computeExpenseByCategory(records) {
    const map = {};
    (records || []).forEach(r => {
      if (r.type !== 'รายจ่าย') return;
      const cat = r.category || 'ไม่ระบุหมวดหมู่';
      map[cat] = (map[cat] || 0) + (r.amount || 0);
    });
    const result = Object.keys(map).map(cat => ({ category: cat, amount: map[cat] }));
    result.sort((a, b) => b.amount - a.amount);
    return result;
  }

    document.getElementById('fin-total-expense').textContent = formatMoney(summary.expense);
    document.getElementById('fin-balance').textContent = formatMoney(summary.balance);

  async function exportFinanceReport() {
    const format = document.getElementById('finance-export-format').value;
    const filters = buildFinanceFilters();
    const btn = document.querySelector('.export-group .btn');
    const originalText = btn.textContent;
    btn.textContent = 'กำลังสร้างไฟล์...';
    btn.disabled = true;
    try {
      const result = await gsRun('exportFinanceReport', filters, format);
      if (!result || !result.success) throw new Error('สร้างไฟล์ไม่สำเร็จ');
      const byteCharacters = atob(result.content);
      const byteNumbers = new Array(byteCharacters.length);
      for (let i = 0; i < byteCharacters.length; i++) {
        byteNumbers[i] = byteCharacters.charCodeAt(i);
      }
      const byteArray = new Uint8Array(byteNumbers);
      const blob = new Blob([byteArray], { type: result.mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = result.filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('ดาวน์โหลดรายงานเรียบร้อย', 'success');
    } catch (e) {
      showToast('ดาวน์โหลดไม่สำเร็จ: ' + e.message, 'error');
    } finally {
      btn.textContent = originalText;
      btn.disabled = false;
    }
  }

  function recomputeTodayFinanceSummary() {

  function upsertFinanceRecordInState(record) {
    const allIdx = state.financeRecords.findIndex(r => r.transaction_id === record.transaction_id);
    if (allIdx >= 0) state.financeRecords[allIdx] = record;
    else state.financeRecords.push(record);

    if (record.date === todayStorage()) {
      const todayIdx = state.todayFinanceRecords.findIndex(r => r.transaction_id === record.transaction_id);
      if (todayIdx >= 0) state.todayFinanceRecords[todayIdx] = record;
      else state.todayFinanceRecords.push(record);
    } else {
      state.todayFinanceRecords = state.todayFinanceRecords.filter(r => r.transaction_id !== record.transaction_id);
    }
    recomputeTodayFinanceSummary();
  }

    state.financeRecords = state.financeRecords.filter(r => r.transaction_id !== id);

    recomputeTodayFinanceSummary();
  }

      await loadSettings();
    } catch (e) {
      showToast('บันทึกการตั้งค่าไม่สำเร็จ: ' + e.message, 'error');
    }
  }

  async function fetchLatestUserId() {
    try {
      const uid = await gsRun('getLatestUserId');
      if (uid) {
        document.getElementById('line-user-id').value = uid;
        showToast('ดึง User ID ล่าสุดเรียบร้อย', 'success');
      } else {
        showToast('ยังไม่มี User ID ล่าสุด กรุณาส่งข้อความหา Bot ก่อน', 'warning');
      }
    } catch (e) {
      showToast('ดึง User ID ไม่สำเร็จ: ' + e.message, 'error');
    }
  }

  async function fetchLatestGroupId() {
    try {
      const gid = await gsRun('getLatestGroupId');
      if (gid) {
        await doAddLineGroup(gid, '');
        showToast('ดึง Group ID ล่าสุดและเพิ่มกลุ่มเรียบร้อย', 'success');
      } else {
        showToast('ยังไม่มี Group ID ล่าสุด กรุณาเพิ่ม Bot เข้ากลุ่มหรือพิมพ์ในกลุ่มก่อน', 'warning');
      }
    } catch (e) {
      showToast('ดึง Group ID ไม่สำเร็จ: ' + e.message, 'error');
    }
  }

  function renderLineGroupList() {
    const list = document.getElementById('line-group-list');
    if (!list) return;
    list.innerHTML = '';
    if (!state.lineGroups || state.lineGroups.length === 0) {
      list.innerHTML = '<li class="empty-state">ยังไม่มีกลุ่ม LINE<br><small style="color:var(--text-secondary)">เพิ่มกลุ่มด้านล่างหรือดึงจาก Webhook</small></li>';
      return;
    }
    state.lineGroups.forEach(g => {
      const li = document.createElement('li');
      li.className = 'settings-list-item';
      li.innerHTML = '<div><strong>' + escapeHtml(g.name || 'กลุ่ม LINE') + '</strong><br><small class="text-secondary">' + escapeHtml(g.group_id) + '</small></div>' +
        '<button type="button" class="btn btn-danger btn-sm" onclick="deleteLineGroup(\'' + g.group_id.replace(/'/g, "\\\\'") + '\')">ลบ</button>';
      list.appendChild(li);
    });
  }

  async function addLineGroup() {
    const idInput = document.getElementById('new-line-group-id');
    const nameInput = document.getElementById('new-line-group-name');
    const id = (idInput.value || '').trim();
    const name = (nameInput.value || '').trim();
    if (!id) return;
    await doAddLineGroup(id, name);
    idInput.value = '';
    nameInput.value = '';
  }

  async function doAddLineGroup(groupId, name) {
    if (state.lineGroups.some(g => g.group_id === groupId)) {
      showToast('กลุ่มนี้มีในระบบแล้ว', 'warning');
      return;
    }
    const previous = state.lineGroups.slice();
    state.lineGroups = state.lineGroups.concat([{ group_id: groupId, name: name || 'กลุ่ม LINE' }]);
    saveStateToCache();
    renderLineGroupList();
    populateNotifyTargetSelects();
    try {
      const added = await gsRun('addLineGroup', groupId, name);
      const idx = state.lineGroups.findIndex(g => g.group_id === groupId);
      if (idx >= 0) state.lineGroups[idx] = { group_id: added.group_id, name: added.name };
      saveStateToCache();
      renderLineGroupList();
      populateNotifyTargetSelects();
      showToast('เพิ่มกลุ่ม LINE เรียบร้อย', 'success');
    } catch (e) {
      state.lineGroups = previous;
      saveStateToCache();
      renderLineGroupList();
      populateNotifyTargetSelects();
      showToast('เพิ่มกลุ่มไม่สำเร็จ: ' + e.message, 'error');
      throw e;
    }
  }

  async function deleteLineGroup(groupId) {
    const previous = state.lineGroups.slice();
    state.lineGroups = state.lineGroups.filter(g => g.group_id !== groupId);
    saveStateToCache();
    renderLineGroupList();
    populateNotifyTargetSelects();
    try {
      await gsRun('deleteLineGroup', groupId);
      showToast('ลบกลุ่ม LINE เรียบร้อย', 'success');
    } catch (e) {
      state.lineGroups = previous;
      saveStateToCache();
      renderLineGroupList();
      populateNotifyTargetSelects();
      showToast('ลบกลุ่มไม่สำเร็จ: ' + e.message, 'error');
    }
  }

  async function testLineMessage() {
    try {
      const res = await gsRun('testLineMessage');
      if (res.success) showToast('ส่งข้อความทดสอบสำเร็จ', 'success');
      else showToast('ส่งข้อความไม่สำเร็จ: ' + res.error, 'error');
    } catch (e) {
      showToast('ทดสอบส่งข้อความไม่สำเร็จ: ' + e.message, 'error');
    }
  }

  async function setupTrigger() {
    try {
      const res = await gsRun('setupReminderTrigger');
      showToast(res.message, 'success');
      updateTriggerStatusUI();
    } catch (e) {
      showToast('เปิด Trigger ไม่สำเร็จ: ' + e.message, 'error');
    }
  }

  async function removeTrigger() {
    try {
      const res = await gsRun('removeTrigger');
      showToast(res.message, 'success');
      updateTriggerStatusUI();
    } catch (e) {
      showToast('ปิด Trigger ไม่สำเร็จ: ' + e.message, 'error');
    }
  }

  async function runReminderCheckNow() {
    try {
      const res = await gsRun('runReminderCheckNow');
      if (res.success) {
        const info = document.getElementById('last-run-info');
        if (info) {
          info.textContent = `รันล่าสุด: ${res.runAt || '-'} | ส่งสำเร็จ: ${res.sent} | ผิดพลาด: ${res.errors}`;
        }
        showToast('ตรวจสอบ Reminder เสร็จแล้ว (ส่ง: ' + res.sent + ', ผิดพลาด: ' + res.errors + ')', 'success');
      }
    } catch (e) {
      showToast('รันเช็ค Reminder ไม่สำเร็จ: ' + e.message, 'error');
    }
  }

  async function runSystemSetup() {
    try {
      const res = await gsRun('runSetup');
      showToast(res.message, 'success');
      await loadSettings();
    } catch (e) {
      showToast('ตั้งค่าไม่สำเร็จ: ' + e.message, 'error');
    }
  }

  async function createRichMenu() {
    const fileId = document.getElementById('rich-menu-file-id').value.trim();
    const warningEl = document.getElementById('rich-menu-warning');
    if (warningEl) warningEl.textContent = '';
    if (!fileId) {
      showToast('กรุณาใส่ Google Drive File ID', 'warning');
      return;
    }
    try {
      const res = await gsRun('createAndUploadRichMenu', fileId);
      if (res.success) {
        document.getElementById('rich-menu-id-display').value = res.richMenuId || '';
        if (res.warning && warningEl) {
          warningEl.textContent = res.warning;
          showToast('สร้าง Rich Menu สำเร็จ แต่ตั้งค่า default ไม่สำเร็จ', 'warning');
        } else {
          showToast('สร้าง Rich Menu สำเร็จ: ' + res.richMenuId, 'success');
        }
      } else {
        showToast('สร้าง Rich Menu ไม่สำเร็จ', 'error');
      }
    } catch (e) {
      showToast('สร้าง Rich Menu ไม่สำเร็จ: ' + e.message, 'error');
    }
  }

  async function uploadRichMenuImage() {
    const richMenuId = document.getElementById('rich-menu-id-display').value.trim();
    const fileId = document.getElementById('rich-menu-file-id').value.trim();
    if (!fileId) {
      showToast('กรุณาใส่ Google Drive File ID', 'warning');
      return;
    }
    try {
      const res = await gsRun('uploadRichMenuImage', richMenuId || null, fileId);
      if (res.success) {
        const warningEl = document.getElementById('rich-menu-warning');
        if (warningEl) warningEl.textContent = '';
        showToast('อัปโหลดรูป Rich Menu สำเร็จ', 'success');
      }
    } catch (e) {
      showToast('อัปโหลดรูปไม่สำเร็จ: ' + e.message, 'error');
    }
  }

  async function retrySetDefaultRichMenu() {
    const richMenuId = document.getElementById('rich-menu-id-display').value.trim();
    if (!richMenuId) {
      showToast('ยังไม่มี Rich Menu ID ให้ตั้งค่า', 'warning');
      return;
    }
    try {
      const res = await gsRun('setDefaultRichMenu', richMenuId);
      if (res.success) {
        const warningEl = document.getElementById('rich-menu-warning');
        if (warningEl) warningEl.textContent = '';
        showToast('ตั้งค่า Rich Menu default สำเร็จ', 'success');
      }
    } catch (e) {
      showToast('ตั้งค่า default ไม่สำเร็จ: ' + e.message, 'error');
    }
  }

  async function deleteRichMenus() {
    openConfirmModal(
      'ยืนยันการลบ Rich Menu',
      'Rich Menu ทั้งหมดจะถูกลบออกจาก LINE Official Account ยืนยันหรือไม่?',
      'ลบ Rich Menu',
      async () => {
        try {
          const res = await gsRun('deleteAllRichMenus');
          if (res.success) {
            document.getElementById('rich-menu-id-display').value = '';
            showToast('ลบ Rich Menu จำนวน ' + (res.deleted || 0) + ' รายการแล้ว', 'success');
          }
        } catch (e) {
          showToast('ลบ Rich Menu ไม่สำเร็จ: ' + e.message, 'error');
        }
      }
    );
  }

  function clearAllData() {
    openConfirmModal(
      'ยืนยันการล้างข้อมูลทั้งหมด',
      'คุณแน่ใจหรือไม่ว่าต้องการล้างข้อมูลทั้งหมด? งาน รายรับ-รายจ่าย และหมวดหมู่ทั้งหมดจะถูกลบ การกระทำนี้ไม่สามารถย้อนกลับได้',
      'ล้างข้อมูล',
      () => doClearAllData()
    );
  }

  async function doClearAllData() {
    try {
      await gsRun('clearAllData');
      showToast('ล้างข้อมูลทั้งหมดเรียบร้อย', 'success');
      await loadCategories();
      await loadFinanceCategories();
      populateCategorySelects();
      navigateTo('dashboard');
    } catch (e) {
      showToast('ล้างข้อมูลไม่สำเร็จ: ' + e.message, 'error');
    }
  }

  /* ================= Helpers ================= */
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
